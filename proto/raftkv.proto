syntax = "proto3";
package raftkv.v1;
option go_package = "github.com/DynamicRaftKV/dynamic-raft-kv/proto/raftkvpb;raftkvpb";

// DRAFT wire contract. No handlers execute consensus or membership logic.
service RaftService {
  rpc AppendEntries(AppendEntriesRequest) returns (AppendEntriesResponse);
  rpc RequestVote(RequestVoteRequest) returns (RequestVoteResponse);
  rpc InstallSnapshot(InstallSnapshotRequest) returns (InstallSnapshotResponse);
  rpc JoinCluster(JoinClusterRequest) returns (JoinClusterResponse);
}
enum EntryKind {
  ENTRY_COMMAND = 0;
  ENTRY_NOOP = 1;
  ENTRY_CONFIGURATION = 2;
}
message Entry {
  uint64 index = 1;
  uint64 term = 2;
  EntryKind kind = 3;
  bytes data = 4;
}
message Peer {
  string id = 1;
  string grpc_address = 2;
  string http_address = 3;
  bool learner = 4;
}
message AppendEntriesRequest {
  uint64 term = 1;
  string leader_id = 2;
  uint64 prev_log_index = 3;
  uint64 prev_log_term = 4;
  repeated Entry entries = 5;
  uint64 leader_commit = 6;
}
message AppendEntriesResponse { uint64 term = 1; bool success = 2; }
message RequestVoteRequest {
  uint64 term = 1;
  string candidate_id = 2;
  uint64 last_log_index = 3;
  uint64 last_log_term = 4;
}
message RequestVoteResponse { uint64 term = 1; bool vote_granted = 2; }
// One unary call per chunk; not a streaming gRPC service. Transfer identity,
// retries, chunk limits and configuration encoding require freeze review.
message InstallSnapshotRequest {
  uint64 term = 1;
  string leader_id = 2;
  uint64 last_included_index = 3;
  uint64 last_included_term = 4;
  bytes configuration = 5;
  bytes data = 6;
  uint64 offset = 7;
  bool done = 8;
}
message InstallSnapshotResponse {
  uint64 term = 1;
  bool accepted = 2;
  uint64 next_offset = 3;
}
message JoinClusterRequest { Peer peer = 1; }
message JoinClusterResponse { bool accepted = 1; string leader_http_address = 2; }
