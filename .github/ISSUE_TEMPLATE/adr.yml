name: ADR proposal
description: Propose or record an Architecture Decision
title: "[ADR] "
labels: ["type: adr", "needs-team-confirmation"]
body:
  - type: textarea
    id: context
    attributes:
      label: Context
      description: What forces and constraints led to this decision?
    validations:
      required: true
  - type: textarea
    id: decision
    attributes:
      label: Decision
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: textarea
    id: consequences
    attributes:
      label: Consequences and risks
    validations:
      required: true
